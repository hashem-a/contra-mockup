<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contra hero photos — contact sheet v2</title>
<style>
  body{margin:0;background:#141417;color:#f5f5f5;font-family:system-ui,sans-serif;padding:24px}
  h1{font-size:20px;margin:0 0 4px}
  p{color:#9aa;margin:0 0 20px;font-size:13px}
  .row{margin-bottom:28px}
  .row h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#d4ed99;margin:0 0 10px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  figure{margin:0;background:#1c1c21;border:1px solid #2a2a30;border-radius:10px;overflow:hidden}
  figure.main{border-color:#d4ed99}
  figure img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover}
  figcaption{padding:8px 10px;font-size:12px;color:#cfd3c4}
  figcaption b{color:#fff}
  .tag{font-size:10px;color:#171a12;background:#d4ed99;border-radius:4px;padding:1px 6px;margin-left:6px}
</style>
</head>
<body>
<h1>Contra hero — people in kit, in action (v2)</h1>
<p>Row = one slide (3 shown together). Column = Top / Center / Bottom. The <b>Center</b> (lime border) is the big dominant photo.</p>

<div class="row">
  <h2>Slide 0 — Sports Clubs</h2>
  <div class="grid">
    <figure><img src="https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Top</b> — floodlit match</figcaption></figure>
    <figure class="main"><img src="https://images.unsplash.com/photo-1517466787929-bc90951d0974?q=80&w=1000&auto=format&fit=crop&ar=3:2"><figcaption><b>Center</b><span class="tag">MAIN</span> soccer player #16, in action</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1547347298-4074fc3086f0?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Bottom</b> — volleyball team celebrating</figcaption></figure>
  </div>
</div>

<div class="row">
  <h2>Slide 1 — Schools &amp; Unis</h2>
  <div class="grid">
    <figure><img src="https://images.unsplash.com/photo-1571008592377-e362723e8998?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Top</b> — youth team + medals</figcaption></figure>
    <figure class="main"><img src="https://images.unsplash.com/photo-1607962837359-5e7e89f86776?q=80&w=1000&auto=format&fit=crop&ar=3:2"><figcaption><b>Center</b><span class="tag">MAIN</span> group running, activewear</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Bottom</b> — running up steps</figcaption></figure>
  </div>
</div>

<div class="row">
  <h2>Slide 2 — Corporate Teams</h2>
  <div class="grid">
    <figure><img src="https://images.unsplash.com/photo-1526506118085-60ce8714f8c5?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Top</b> — training on bars</figcaption></figure>
    <figure class="main"><img src="https://images.unsplash.com/photo-1577471488278-16eec37ffcc2?q=80&w=1000&auto=format&fit=crop&ar=3:2"><figcaption><b>Center</b><span class="tag">MAIN</span> basketball dunk, numbered kit</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1534367610401-9f5ed68180aa?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Bottom</b> — weightlifting, training wear</figcaption></figure>
  </div>
</div>

<div class="row">
  <h2>Slide 3 — Every Event</h2>
  <div class="grid">
    <figure><img src="https://images.unsplash.com/photo-1594737625785-a6cbdabd333c?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Top</b> — push-ups w/ dumbbells</figcaption></figure>
    <figure class="main"><img src="https://images.unsplash.com/photo-1540539234-c14a20fb7c7b?q=80&w=1000&auto=format&fit=crop&ar=3:2"><figcaption><b>Center</b><span class="tag">MAIN</span> runner in motion</figcaption></figure>
    <figure><img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?q=80&w=800&auto=format&fit=crop&ar=3:2"><figcaption><b>Bottom</b> — barbell deadlift</figcaption></figure>
  </div>
</div>

</body>
</html>
